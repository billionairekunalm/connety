<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efeaff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Connections" />
    <title>Connections</title>
    <style>
      /* Splash: pure CSS so it paints before any JavaScript loads. */
      #splash {
        --bg: #efeaff; --ink: #111111; --sub: #6b6880;
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; align-content: center; gap: 22px;
        background: var(--bg); font-family: 'Outfit', system-ui, sans-serif; transition: opacity .32s ease, visibility .32s;
      }
      @media (prefers-color-scheme: dark) { #splash { --bg: #121019; --ink: #f2f0fa; --sub: #9a96ad; } }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .logo { position: relative; width: 132px; height: 132px; }
      #splash .ripple {
        position: absolute; inset: 0; border-radius: 50%; border: 2px solid #a99bff; opacity: 0;
        animation: sp-ripple 1s .5s ease-out both;
      }
      #splash .ripple.r2 { animation-delay: .65s; }
      #splash .dot { position: absolute; top: 50%; width: 64px; height: 64px; margin-top: -32px; border-radius: 50%; }
      #splash .a { left: 4px; background: #111; box-shadow: 0 0 0 3px var(--bg); animation: sp-a .62s cubic-bezier(.2, .9, .25, 1.15) both; }
      #splash .b { right: 4px; background: #ffc145; animation: sp-b .62s cubic-bezier(.2, .9, .25, 1.15) both; }
      @media (prefers-color-scheme: dark) { #splash .a { background: #f2f0fa; } }
      #splash .logo { animation: sp-float 1.2s .55s ease-in-out both; }
      #splash h1 { margin: 0; display: flex; font-size: 38px; font-weight: 800; letter-spacing: -1px; color: var(--ink); }
      #splash h1 span { display: inline-block; opacity: 0; transform: translateY(14px); animation: sp-letter .42s cubic-bezier(.2, .8, .2, 1) both; }
      #splash p { margin: -12px 0 0; font-size: 15px; color: var(--sub); opacity: 0; animation: sp-fade .5s 1s ease both; }
      @keyframes sp-a { from { transform: translateX(-70px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sp-b { from { transform: translateX(70px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sp-ripple { from { transform: scale(.55); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
      @keyframes sp-float { 0%, 100% { transform: none; } 45% { transform: scale(1.1) rotate(-4deg); } }
      @keyframes sp-letter { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash .logo { animation: none !important; opacity: 1 !important; transform: none !important; }
        #splash .ripple { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="presentation" aria-hidden="true">
      <div class="logo"><i class="ripple"></i><i class="ripple r2"></i><i class="dot a"></i><i class="dot b"></i></div>
      <h1><span style="animation-delay:.62s">C</span><span style="animation-delay:.66s">o</span><span style="animation-delay:.70s">n</span><span style="animation-delay:.74s">n</span><span style="animation-delay:.78s">e</span><span style="animation-delay:.82s">c</span><span style="animation-delay:.86s">t</span><span style="animation-delay:.90s">i</span><span style="animation-delay:.94s">o</span><span style="animation-delay:.98s">n</span><span style="animation-delay:1.02s">s</span></h1>
      <p>Never lose a person you met.</p>
    </div>
    <script>
      // Show once per visit; skip for scanned card/room links so visitors see the page straight away.
      // Hides when the app calls hideSplash(), but never before the animation has had time to play.
      (function () {
        // MIN = when the fade-out starts; the 0.3s fade then brings the total to about 2 seconds.
        var s = document.getElementById('splash'), MIN = 1700, t0 = Date.now(), done = false
        function remove() { s.classList.add('out'); setTimeout(function () { s.remove() }, 400) }
        var skip = /[?&](u|room)=/.test(location.search)
        try { skip = skip || sessionStorage.getItem('splash-seen') === '1'; sessionStorage.setItem('splash-seen', '1') } catch (e) {}
        if (skip) return s.remove()
        window.hideSplash = function () {
          if (done) return
          done = true
          setTimeout(remove, Math.max(0, MIN - (Date.now() - t0)))
        }
        s.addEventListener('click', function () { done = true; remove() }) // tap to skip
        setTimeout(window.hideSplash, 4000) // safety: never trap someone behind the splash
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
